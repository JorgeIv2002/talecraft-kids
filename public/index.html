<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TaleCraft Kids</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF7F2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      color: #2D231B;
    }
    .emoji {
      font-size: 72px;
      margin-bottom: 16px;
      animation: bounce 1.5s infinite;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      color: #FF6B4A;
    }
    p {
      font-size: 14px;
      color: #786C60;
      margin: 0;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
  </style>
</head>
<body>
  <div class="emoji">🦉</div>
  <h1>TaleCraft Kids</h1>
  <p>Abriendo tu biblioteca mágica...</p>
</body>
</html>
